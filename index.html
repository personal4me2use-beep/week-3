<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f3f7f4">
	<title>Weather Desk</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #20332b;
			--muted: #69796f;
			--green: #286749;
			--line: #dce5df;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			padding: 10vh 16px;
			background: #f3f7f4;
			color: var(--ink);
			font-family: "Trebuchet MS", sans-serif;
		}

		main { width: min(100%, 440px); margin: 0 auto; }
		h1 { margin: 0 0 20px; font: 500 38px Georgia, serif; }

		.weather-panel {
			padding: 24px;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: white;
		}

		form { display: grid; gap: 12px; }
		.field { display: grid; gap: 6px; }
		label { color: var(--muted); font-size: 13px; }

		input, button {
			width: 100%;
			min-height: 42px;
			padding: 0 11px;
			border-radius: 3px;
			font: 14px "Trebuchet MS", sans-serif;
		}

		input { border: 1px solid var(--line); color: var(--ink); }
		input:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

		button {
			border: 1px solid var(--green);
			background: var(--green);
			color: white;
			cursor: pointer;
		}

		button:disabled { cursor: wait; opacity: 0.7; }
		.status { min-height: 20px; margin: 12px 0 0; color: var(--muted); font-size: 13px; }
		.status.error { color: #a33f31; }
		.weather-result[hidden] { display: none; }

		.weather-result { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 12px; padding-top: 18px; border-top: 1px solid var(--line); }
		.weather-location { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
		.weather-icon { width: 48px; height: 48px; }
		.place { margin: 0; font-size: 18px; }
		.condition { margin: 5px 0 0; color: var(--muted); text-transform: capitalize; }
		.temperature { margin: 0; font: 48px Georgia, serif; white-space: nowrap; }
		.temperature .unit { color: var(--green); font-size: 22px; }
		.weather-stat { display: grid; gap: 5px; margin: 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
		.weather-stat strong { color: var(--ink); font-size: 15px; }
		.credit { margin: 14px 0 0; color: var(--muted); font-size: 11px; text-align: center; }

		@media (min-width: 700px) {
			body { padding-right: 32px; padding-left: 32px; }
			main { width: min(100%, 920px); }
			h1 { margin-bottom: 28px; font-size: 46px; }
			.weather-panel { padding: 32px; }
			form { grid-template-columns: minmax(180px, 1fr) minmax(240px, 1.3fr) auto; align-items: end; gap: 16px; }
			form button { width: auto; padding: 0 20px; }
			.weather-result { grid-template-columns: minmax(150px, 1.5fr) repeat(4, minmax(72px, 1fr)); align-items: center; gap: 14px; }
			.weather-location { grid-column: auto; }
			.temperature { font-size: 52px; }
			.weather-stat { padding: 10px 0 10px 14px; border-top: 0; border-left: 1px solid var(--line); }
		}

		@media (max-width: 380px) {
			.weather-panel { padding: 18px; }
		}
	</style>
</head>
<body>
	<main>
		<h1>Weather</h1>

		<section class="weather-panel" aria-label="City weather lookup">
			<form id="weather-form">
				<div class="field">
					<label for="city">City</label>
					<input id="city" name="city" type="text" placeholder="e.g. Tokyo" autocomplete="off" required>
				</div>
				<div class="field">
					<label for="api-key">OpenWeatherMap API key</label>
					<input id="api-key" name="api-key" type="password" placeholder="Enter your API key" autocomplete="off" required>
				</div>
				<button id="search-button" type="submit">Get weather</button>
			</form>

			<p class="status" id="status" role="status" aria-live="polite"></p>

			<div class="weather-result" id="weather-result" aria-live="polite" hidden>
				<div class="weather-location">
					<div>
						<h2 class="place" id="place"></h2>
						<p class="condition" id="condition"></p>
					</div>
					<img class="weather-icon" id="weather-icon" alt="">
				</div>
				<p class="temperature"><span id="temperature">--</span><span class="unit">°C</span></p>
				<p class="weather-stat">Humidity<strong id="humidity">--%</strong></p>
				<p class="weather-stat">Feels like<strong id="feels-like">--°C</strong></p>
				<p class="weather-stat">Wind<strong id="wind">-- m/s</strong></p>
			</div>
		</section>

		<p class="credit">Weather data by OpenWeatherMap</p>
	</main>

	<script>
		const form = document.querySelector("#weather-form");
		const cityInput = document.querySelector("#city");
		const apiKeyInput = document.querySelector("#api-key");
		const searchButton = document.querySelector("#search-button");
		const statusElement = document.querySelector("#status");
		const resultElement = document.querySelector("#weather-result");

		function showStatus(message, isError = false) {
			statusElement.textContent = message;
			statusElement.classList.toggle("error", isError);
		}

		function showWeather(weather) {
			const condition = weather.weather[0];
			const placeParts = [weather.name, weather.sys.country].filter(Boolean);

			document.querySelector("#place").textContent = placeParts.join(", ");
			document.querySelector("#condition").textContent = condition.description
				.replace(/\b\w/g, letter => letter.toUpperCase());
			document.querySelector("#weather-icon").src = `https://openweathermap.org/img/wn/${condition.icon}@2x.png`;
			document.querySelector("#weather-icon").alt = condition.description;
			document.querySelector("#temperature").textContent = String(Math.round(weather.main.temp));
			document.querySelector("#humidity").textContent = `${weather.main.humidity}%`;
			document.querySelector("#feels-like").textContent = `${Math.round(weather.main.feels_like)}°C`;
			document.querySelector("#wind").textContent = `${weather.wind.speed} m/s`;
			resultElement.hidden = false;
		}

		form.addEventListener("submit", async event => {
			event.preventDefault();
			const city = cityInput.value.trim();
			const apiKey = apiKeyInput.value.trim();

			if (!city || !apiKey) {
				showStatus("Enter a city and API key to continue.", true);
				return;
			}

			searchButton.disabled = true;
			resultElement.hidden = true;
			showStatus("Getting current conditions…");

			const parameters = new URLSearchParams({ q: city, appid: apiKey, units: "metric" });

			try {
				const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?${parameters}`);
				const weather = await response.json();

				if (!response.ok) {
					const message = response.status === 404
						? "City not found. Check the spelling and try again."
						: response.status === 401
							? "That API key was not accepted. Check the key and try again."
							: weather.message || "Weather data could not be loaded. Try again.";
					throw new Error(message);
				}

				showWeather(weather);
				showStatus(`Current conditions for ${weather.name}.`);
			} catch (error) {
				showStatus(error instanceof TypeError
					? "Could not connect to the weather service. Check your connection and try again."
					: error.message, true);
			} finally {
				searchButton.disabled = false;
			}
		});
	</script>
</body>
</html>
